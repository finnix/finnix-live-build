# SPDX-PackageName: finnix-live-build
# SPDX-PackageSupplier: Ryan Finnie <ryan@finnie.org>
# SPDX-PackageDownloadLocation: https://forge.colobox.com/finnix/finnix-live-build
# SPDX-FileComment: Woodpecker CI ci workflow
# SPDX-FileCopyrightText: © 2026 Ryan Finnie <ryan@finnie.org>
# SPDX-License-Identifier: MPL-2.0
---
when:
  - event: ["push", "pull_request", "manual"]
  - event: "cron"
    cron: "weekly"
matrix:
  include:
    - ARCH: "amd64"
      PLATFORM: "linux/amd64"
    - ARCH: "arm64"
      PLATFORM: "linux/arm64"
labels:
  platform: "${PLATFORM}"
  pool: "snowman"
clone:
  git:
    image: "docker.io/woodpeckerci/plugin-git:latest@sha256:ebde4a4d07e0e24b630082484d192890dd4f6d442d90bf5466f0763860f83652"  # 2026-05-28
steps:
  - name: "Docker CI build (${ARCH})"
    image: "docker.io/library/debian:trixie@sha256:4ae67669760b807c19f23902a3fd7c121a6a70cf2ae709035674b23e712e4d62"  # 2026-05-19
    commands: |
      set -x

      mkdir -p /etc/apt/apt.conf.d
      cat <<"EOM" >/etc/apt/apt.conf.d/99proxy
      Acquire::http::Proxy "http://deb-proxy.snowman.lan:8000";
      Acquire::https::Proxy "http://deb-proxy.snowman.lan:8000";
      EOM

      apt update
      apt -y install git docker-cli docker-buildx

      IMAGE_NAME="$(echo "$${CI_REPO}" | tr '[:upper:]' '[:lower:]')"
      IMAGE_TAG="$${CI_WORKFLOW_NAME}-$${ARCH}"
      IMAGE_ID="build/$${IMAGE_NAME}:$${IMAGE_TAG}"
      docker image build -t "$${IMAGE_ID}" \
          --build-arg BUILD_TAGS="env:docker" \
          --build-arg CI_SYSTEM_NAME \
          --build-arg CI_WORKFLOW_NAME \
          --build-arg CI_PIPELINE_URL \
          .
      docker image history "$${IMAGE_ID}"
      docker image inspect "$${IMAGE_ID}"
      IMAGE_DIGEST="sha256:$(docker buildx imagetools inspect "$${IMAGE_ID}" --raw | sha256sum | awk '{print $1}')"
      echo "Digest: $${IMAGE_DIGEST}"
  - name: "Notify Mastodon if failure"
    when:
      - status: ["failure"]
    image: "docker.io/woodpeckerci/plugin-mastodon-post:latest@sha256:456597681cff794b6ddb7b085ce95c42a18301e512503898c4abdaa1080e7e4c"  # 2026-04-19
    settings:
      server_url: "https://m29.us"
      access_token:
        from_secret: "m29_token"
      status: |
        🪿 🪿 🪿 FAILURE: {{ CI_REPO }} 🪿 🪿 🪿
        Workflow: {{ CI_WORKFLOW_NAME }} ({{ CI_PIPELINE_EVENT }} on {{ CI_COMMIT_REF }})

        Pipeline: {{ CI_PIPELINE_URL }}
        Commit: {{ CI_PIPELINE_FORGE_URL }}
